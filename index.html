<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BOUNCE — Endless Climb Arcade</title>
  <meta name="description" content="BOUNCE is a sleek neon vertical endless-climbing arcade game built with HTML5 Canvas and Vanilla JavaScript.">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=results1">
</head>
<body>
  <div class="game-wrapper">
    <!-- Main Game Container -->
    <div class="game-container" id="gameContainer">
      <!-- HUD (In-Game Top Bar) -->
      <div class="game-hud" id="gameHud">
        <!-- Level & Progress Group -->
        <div class="hud-level-group">
          <div class="hud-level-info">
            <span class="hud-level-text" id="hudLevelText">LVL 1</span>
          </div>
          <div class="level-progress-track" title="Level Progress">
            <div class="level-progress-bar" id="hudLevelProgress"></div>
          </div>
        </div>

        <!-- Scores -->
        <div class="hud-scores-group">
          <div class="hud-item">
            <span class="hud-label">ALT</span>
            <span class="hud-value" id="hudScore">0</span>
          </div>
          <div class="hud-item">
            <span class="hud-label">BEST</span>
            <span class="hud-value" id="hudBest">0</span>
          </div>
        </div>

        <!-- Collectibles in HUD (Energy Orbs & Special Stars) -->
        <div class="hud-collectibles-group">
          <div class="hud-collectible-item" title="Energy Orbs Collected">
            <span class="hud-orb-dot"></span>
            <span class="hud-collectible-val" id="hudRunOrbs">0</span>
          </div>
          <div class="hud-collectible-item" title="Special Stars Collected">
            <span class="hud-star-glyph">★</span>
            <span class="hud-collectible-val gold-accent" id="hudRunStars">0</span>
          </div>
        </div>

        <!-- Action Controls (Sound & Pause) -->
        <div class="hud-actions-group">
          <button class="icon-btn" id="soundBtn" title="Toggle Sound (M)" aria-label="Toggle Sound">
            <!-- Audio ON icon -->
            <svg class="sound-on-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path>
            </svg>
            <!-- Audio OFF icon -->
            <svg class="sound-off-icon hidden" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"></path>
            </svg>
          </button>
          <button class="icon-btn" id="pauseBtn" title="Pause Game (Esc)" aria-label="Pause Game">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <rect x="6" y="4" width="4" height="16" rx="1.5"></rect>
              <rect x="14" y="4" width="4" height="16" rx="1.5"></rect>
            </svg>
          </button>
        </div>
      </div>

      <!-- Level Milestone Notification Banner -->
      <div class="level-banner hidden" id="levelBanner">
        <div class="level-banner-title" id="levelBannerTitle">LEVEL 2 REACHED!</div>
        <div class="level-banner-sub">NEW MILESTONE UNLOCKED</div>
      </div>

      <!-- Canvas rendering surface -->
      <canvas id="gameCanvas" width="480" height="700"></canvas>

      <!-- Floating mobile touch controls (active during active mobile gameplay) -->
      <div class="touch-controls floating-controls controls-inactive" id="touchControls" aria-label="Mobile Controls">
        <!-- Lower-left region: LEFT and RIGHT steering cluster -->
        <div class="touch-cluster cluster-left">
          <button class="touch-btn floating-btn btn-steer btn-left" id="touchLeft" aria-label="Steer Left">
            <span class="btn-icon touch-icon">&larr;</span>
            <span class="btn-sublabel touch-sublabel">LEFT</span>
          </button>
          <button class="touch-btn floating-btn btn-steer btn-right" id="touchRight" aria-label="Steer Right">
            <span class="btn-icon touch-icon">&rarr;</span>
            <span class="btn-sublabel touch-sublabel">RIGHT</span>
          </button>
        </div>

        <!-- Lower-right region: DOWN and JUMP action cluster -->
        <div class="touch-cluster cluster-right">
          <button class="touch-btn floating-btn btn-action btn-down" id="touchDown" aria-label="Dive Down">
            <span class="btn-icon touch-icon">&darr;</span>
            <span class="btn-sublabel touch-sublabel">DIVE</span>
          </button>
          <button class="touch-btn floating-btn btn-action btn-jump" id="touchUp" aria-label="Air Jump">
            <span class="btn-icon touch-icon">&uarr;</span>
            <span class="btn-sublabel touch-sublabel">JUMP</span>
          </button>
        </div>
      </div>

      <!-- UI Overlays -->
      <!-- 1. Main Menu Screen (Authentic Mobile Arcade Home Screen) -->
      <div class="ui-screen active home-screen" id="menuScreen">
        <div class="home-screen-layout">
          <!-- Subtle atmospheric lighting aura -->
          <div class="home-ambient-glow" aria-hidden="true"></div>

          <!-- Upper Portion: Native BOUNCE Emblem & Lettering -->
          <div class="brand-logo-container">
            <img class="brand-logo-img" src="assets/bounce-logo-transparent.png" alt="BOUNCE" width="320" height="320" decoding="async">
            <h1 class="visually-hidden">BOUNCE</h1>
          </div>

          <!-- Lower Portion: One Unmistakable, Prominent Arcade CLIMB Button -->
          <div class="home-action-container">
            <button class="climb-btn" id="playBtn" aria-label="Start Climbing">
              <span class="climb-btn-content">
                <span class="climb-text">CLIMB</span>
                <svg class="climb-chevron" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
              </span>
              <div class="climb-btn-aura" aria-hidden="true"></div>
              <div class="climb-btn-sheen" aria-hidden="true"></div>
            </button>
          </div>
        </div>
      </div>

      <!-- 2. Pause Overlay -->
      <div class="ui-screen hidden" id="pauseScreen">
        <div class="screen-content">
          <h2 class="neon-screen-title">GAME PAUSED</h2>
          <p class="screen-subtext">Take a breather</p>

          <div class="pause-actions">
            <button class="neon-btn primary-neon-btn" id="resumeBtn">
              <span>RESUME</span>
              <div class="btn-glow"></div>
            </button>
            <button class="neon-btn secondary-neon-btn" id="restartFromPauseBtn">
              <span>RESTART</span>
            </button>
          </div>
        </div>
      </div>

      <!-- 3. Results Screen (Premium Mobile Arcade Run-Complete Screen) -->
      <div class="ui-screen hidden results-screen" id="gameOverScreen">
        <div class="results-screen-layout">
          <!-- Atmospheric ambient glow behind rating -->
          <div class="results-ambient-glow" aria-hidden="true"></div>

          <!-- Top Header: RUN COMPLETE + Small Muted Reason -->
          <div class="results-header-zone">
            <h2 class="results-title" id="resultsTitle">RUN COMPLETE</h2>
            <p class="results-subtext" id="gameOverSubtext">The orb fell into the void</p>
          </div>

          <!-- Rating Stars & Dynamic Verdict Text -->
          <div class="results-stars-zone">
            <div class="results-stars-row" id="ratingStarsContainer">
              <span class="rating-star" id="starIcon1" aria-label="First star">★</span>
              <span class="rating-star" id="starIcon2" aria-label="Second star">★</span>
              <span class="rating-star" id="starIcon3" aria-label="Third star">★</span>
            </div>
            <div class="results-verdict" id="ratingVerdictText">NO STARS EARNED</div>
          </div>

          <!-- Core Results Data: Hero Altitude + Sub-metrics -->
          <div class="results-metrics-zone">
            <!-- Hero Altitude Metric -->
            <div class="hero-altitude-block">
              <span class="hero-altitude-label">ALTITUDE</span>
              <span class="hero-altitude-num" id="finalScore">0</span>

              <!-- Tasteful Animated Neon Record Pill (Shown only on genuine new record) -->
              <div class="record-badge hidden" id="newBestTag">
                <span class="record-badge-icon">★</span>
                <span class="record-badge-text">NEW RECORD</span>
              </div>
            </div>

            <!-- Sleek Horizontal Sub-Metrics: Level, Orbs, Stars -->
            <div class="sub-metrics-row">
              <div class="sub-metric-item">
                <span class="sub-metric-label">LEVEL</span>
                <span class="sub-metric-val gold-accent" id="finalLevelReached">1</span>
              </div>
              <div class="sub-metric-divider" aria-hidden="true"></div>
              <div class="sub-metric-item">
                <span class="sub-metric-label">ORBS</span>
                <span class="sub-metric-val cyan-accent" id="finalRunOrbs">0</span>
              </div>
              <div class="sub-metric-divider" aria-hidden="true"></div>
              <div class="sub-metric-item">
                <span class="sub-metric-label">STARS</span>
                <span class="sub-metric-val star-accent" id="finalRunStars">0</span>
              </div>
            </div>

            <!-- Subtle Best Altitude Footer Tag -->
            <div class="best-record-cue">
              <span class="best-record-label">RECORD ALT</span>
              <span class="best-record-val" id="finalBestScore">0</span>
            </div>

            <!-- Preserved metadata hooks for lifetime stats -->
            <div class="results-hidden-meta visually-hidden" aria-hidden="true">
              <span id="finalHighestLevel">1</span>
              <span id="finalTotalOrbs">0</span>
              <span id="finalTotalStars">0</span>
            </div>
          </div>

          <!-- Actions Zone: CLIMB AGAIN (Dominant) & MAIN MENU (Secondary) -->
          <div class="results-actions-zone">
            <button class="climb-again-btn" id="restartBtn" aria-label="Climb Again">
              <span class="btn-content">
                <span>CLIMB AGAIN</span>
                <svg class="btn-chevron" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
              </span>
              <div class="btn-aura" aria-hidden="true"></div>
              <div class="btn-sheen" aria-hidden="true"></div>
            </button>
            <button class="menu-return-btn" id="menuReturnBtn" aria-label="Return to Main Menu">
              <span>MAIN MENU</span>
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
